# ros2_control 控制器配置
#
# ⚠ 参数层级说明（两个都踩过的坑，改动前请先读）：
#
#   1) 控制器自身的参数必须写成【独立节点段】，即顶层键为控制器名：
#          gripper_controller:
#            ros__parameters:
#              joints: [...]
#      不要写成 controller_manager 下的嵌套参数：
#          controller_manager:
#            ros__parameters:
#              gripper_controller:
#                joints: [...]
#      后者 controller_manager 只读取其中的 type 用于加载控制器，
#      不会把 joints 转交给控制器节点，会报 "'joints' parameter was empty"。
#
#   2) launch 中不要给 ros2_control_node 显式指定 name='controller_manager'。
#      显式指定会追加 `-r __node:=controller_manager` 重映射并被控制器继承，
#      使所有控制器节点都叫 /controller_manager，第 1 条中的独立段随之失配。
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: position_controllers/JointGroupPositionController

gripper_controller:
  ros__parameters:
    # 只控**总控关节**：取值是相对闭合位的行程（m），不是两指内侧面间距的绝对值
    # （两者相差一个模型闭合间隙，见 urdf/litegrip_urdf.urdf.xacro 文首）。
    #   0.0      -> 实测闭合标定位（本机实测闭合间隙 1.508 mm）
    #   0.085452 -> 全开（= 2 × 实测单指行程 0.042726；本机卡尺实测张开开口 86.960 mm）
    # 两指（gripper_slide_joint_left/right）是它的 <mimic>：数值由总控关节唯一决定，
    # 在 ros2_control 里没有命令接口，也不应被单独下指令。
    joints:
      - gripper_opening_joint

# ---------------------------------------------------------------------------
# 说明：现在模型里只有一个可命令关节（总控关节），因此也可以用
#   position_controllers/GripperActionController —— 它只接受单个关节，与当前的
# URDF 结构正好匹配（两指是 <mimic>，不需要命令接口）。真实的硬件组件
# （litegrip_ros2_control）就走这条路，因为它能直接表达「闭合到接触即停」，
# 不必靠 goal_time: 0.0 放弃轨迹监控来换取同一个行为。
# 本包自带的 mock 链路仍用 JointGroupPositionController：单关节的组控制器与
# 多关节写法一致，将来若真加了独立自由度不用换控制器类型。
